# Cargo-deny configuration for Strata workspace
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false
# Gate the shipping graph. Dev-only tooling (test servers, proptest,
# criterion, stratahub-testkit's wire-conformance stack) never reaches a
# user build; advisories and licenses for it are the owning repo's concern.
exclude-dev = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained - compile-time proc-macro via arrow/parquet; drops with the next arrow upgrade" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
exceptions = [
    # dirs -> dirs-sys -> option-ext (hub global-config path). MPL-2.0 is
    # file-scoped weak copyleft; the crate ships unmodified.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # const-random proc-macro via arrow/ahash; compile-time only.
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # The StrataHub protocol/client crates, pinned by rev in strata-hub.
    "https://github.com/stratalab/stratahub",
    # stratahub-metadata pins strata-executor at the blessed engine-swap
    # SHA; enters the graph only behind strata-hub's `ingest` feature.
    "https://github.com/stratalab/strata-core.git",
]
