[package]
name = "strata-benchmarks"
version = "0.1.0"
edition = "2021"
description = "Regression benchmarks for the Strata cleanup program"
license = "Apache-2.0"
publish = false
autobins = false

[features]
default = []
rocksdb-compare = ["dep:rocksdb"]

[dependencies]
strata-engine-next = { path = "../crates/engine-next", features = ["testkit"] }
strata-storage-next = { path = "../crates/storage-next", features = ["perf-trace"] }
serde = { version = "1.0", features = ["derive"] }
# The old root `stratadb` package (a bench dependency until the V1 cutover)
# installed jemalloc as the global allocator, so every recorded benchmark
# number is a jemalloc number. Pin it here explicitly to keep the instrument
# comparable across the cutover — glibc malloc costs ~25% on the write path.
tikv-jemallocator = "0.6"

serde_json = "1.0"
tempfile = "3.8"
fastrand = "2.0.0"
chrono = "0.4"
rocksdb = { version = "0.22.0", default-features = false, features = [
    "lz4",
], optional = true }

[dev-dependencies]
byte-unit = "5.1.6"
walkdir = "2.5.0"
hex = "0.4"

[[bin]]
name = "bench-compare"
path = "src/bin/compare.rs"

[[bin]]
name = "storage-next-l9-scale"
path = "src/bin/storage_next_l9_scale.rs"

[[bin]]
name = "storage-next-point-spike"
path = "src/bin/storage_next_point_spike.rs"

[[bin]]
name = "storage-next-concurrent-writers"
path = "src/bin/storage_next_concurrent_writers.rs"

[[bin]]
name = "storage-next-concurrent-reads"
path = "src/bin/storage_next_concurrent_reads.rs"

[[bin]]
name = "engine-kv-scan-regression"
path = "src/bin/engine_kv_scan_regression.rs"

[[bin]]
name = "engine-kv-scale"
path = "src/bin/engine_kv_scale.rs"

[[bin]]
name = "engine-ycsb"
path = "src/bin/engine_ycsb.rs"

[[bin]]
name = "rocksdb-ycsb"
path = "src/bin/rocksdb_ycsb.rs"
required-features = ["rocksdb-compare"]

[[bin]]
name = "engine-vector-indexing"
path = "src/bin/engine_vector_indexing.rs"

[[bin]]
name = "storage-next-after-version-scan"
path = "src/bin/storage_next_after_version_scan.rs"

[[bin]]
name = "storage-next-l0-compact"
path = "src/bin/storage_next_l0_compact.rs"

[profile.bench]
debug = true

# Explicit standalone-workspace root. A no-op in the main checkout (the root manifest already
# excludes `benchmarks/`), but required for git worktrees: without it, cargo walks up past the
# worktree and resolves against the ORIGINAL checkout's root manifest, whose `exclude`
# entries don't match the worktree path — "current package believes it's in a workspace".
[workspace]
