[package]
name = "strata-benchmarks"
version = "0.1.0"
edition = "2021"
description = "Regression benchmarks for the Strata cleanup program"
license = "Apache-2.0"
publish = false
autobins = false

[features]
default = []
embed = ["stratadb/embed"]

[dependencies]
stratadb = { path = ".." }
strata-core = { path = "../crates/core" }
strata-engine = { path = "../crates/engine" }
strata-engine-next = { path = "../crates/engine-next", features = ["testkit"] }
strata-storage = { path = "../crates/storage", features = ["perf-trace"] }
strata-storage-next = { path = "../crates/storage-next", features = ["perf-trace"] }
# Required only for the B6 materialize smoke in `src/bin/regression.rs`:
# the benchmark opens a fresh engine `Database` rather than reusing the
# `Strata` executor, which does not expose `storage().materialize_layer`.
# The engine-owned graph/vector/search subsystems preserve the product runtime
# hooks needed by that direct engine open.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8"
fastrand = "2.0.0"
chrono = "0.4"
# Used by the `rocksdb-ycsb` comparison bin (and the `ycsb_compare` bench); a
# regular dependency so the bin can link it.
rocksdb = { version = "0.22.0", default-features = false, features = ["lz4"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
redb = "2"
heed = "0.22"
sled = "0.34.7"
fjall = "=2.11"
rusqlite = { version = "0.32", features = ["bundled"] }
ctrlc = "3.2.3"
env_logger = "0.11"
comfy-table = "7.0.1"
byte-unit = "5.1.6"
walkdir = "2.5.0"
hex = "0.4"

[[bench]]
name = "redb_benchmark"
path = "benches/redb_benchmark.rs"
harness = false

[[bench]]
name = "ycsb_compare"
path = "benches/ycsb_compare.rs"
harness = false

[[bench]]
name = "wal_latency"
path = "benches/wal_latency.rs"
harness = false

[[bin]]
name = "beir"
path = "src/bin/beir.rs"

[[bin]]
name = "bench-compare"
path = "src/bin/compare.rs"

[[bin]]
name = "regression"
path = "src/bin/regression.rs"

[[bin]]
name = "storage-next-l9-scale"
path = "src/bin/storage_next_l9_scale.rs"

[[bin]]
name = "storage-old-cache-scale"
path = "src/bin/storage_old_cache_scale.rs"

[[bin]]
name = "storage-next-point-spike"
path = "src/bin/storage_next_point_spike.rs"

[[bin]]
name = "storage-next-concurrent-reads"
path = "src/bin/storage_next_concurrent_reads.rs"

[[bin]]
name = "engine-kv-scan-regression"
path = "src/bin/engine_kv_scan_regression.rs"

[[bin]]
name = "engine-kv-scale"
path = "src/bin/engine_kv_scale.rs"

[[bin]]
name = "engine-ycsb"
path = "src/bin/engine_ycsb.rs"

[[bin]]
name = "rocksdb-ycsb"
path = "src/bin/rocksdb_ycsb.rs"

[[bin]]
name = "engine-vector-indexing"
path = "src/bin/engine_vector_indexing.rs"

[[bin]]
name = "storage-next-after-version-scan"
path = "src/bin/storage_next_after_version_scan.rs"

[profile.bench]
debug = true
