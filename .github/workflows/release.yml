name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # strata-hub pins the stratahub crates by git rev; the repo is private.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  format-gate:
    # Release gate: the frozen durable format and the capability contract
    # must hold on the exact tagged commit — releases must not rely on
    # main having been green at some earlier point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Frozen-format golden vectors
        run: cargo test --locked -p strata-storage --test format_golden
      - name: Capability contract
        run: cargo test --locked -p strata-engine --test capability_conformance

  # ---------------------------------------------------------------------------
  # 1. Build the strata binary per target (all native runners, no cross)
  # ---------------------------------------------------------------------------
  build:
    needs: format-gate
    name: Build strata (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked -p strata-cli --target ${{ matrix.target }}
      - name: Smoke-test the binary
        run: |
          BIN=target/${{ matrix.target }}/release/strata
          "$BIN" --version
          "$BIN" --cache ping
      - name: Upload strata binary
        uses: actions/upload-artifact@v4
        with:
          name: strata-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/strata

  # ---------------------------------------------------------------------------
  # 1b. Build the browser wasm bundle (cache-mode engine + the CLI parser),
  #     consumed by stratadb.org's /playground via fetch-from-release.
  # ---------------------------------------------------------------------------
  build-wasm:
    needs: format-gate
    name: Build wasm playground bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (matching Cargo.lock)
        run: |
          VERSION="$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Build wasm bundle
        run: |
          cargo build --release --locked -p strata-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web \
            --out-dir crates/wasm/www/pkg \
            target/wasm32-unknown-unknown/release/strata_wasm.wasm
      - name: Package the wasm bundle
        run: tar czf strata-wasm-web.tar.gz -C crates/wasm/www/pkg strata_wasm.js strata_wasm_bg.wasm
      - name: Upload wasm bundle
        uses: actions/upload-artifact@v4
        with:
          name: wasm-web
          path: strata-wasm-web.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Package archives (flat layout: strata + README at the root, matching
  #    the v0.6.x install.sh contract)
  # ---------------------------------------------------------------------------
  package:
    name: Package (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download strata binary
        uses: actions/download-artifact@v4
        with:
          name: strata-${{ matrix.target }}
          path: staging

      - name: Package
        run: |
          chmod +x staging/strata
          cp README.md staging/
          ARCHIVE_NAME="strata-v${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar czf "${ARCHIVE_NAME}" -C staging strata README.md
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ${{ env.ARCHIVE_NAME }}

  # ---------------------------------------------------------------------------
  # 3. Create the GitHub Release with checksums
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [package, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      # The browser wasm bundle (strata_wasm.js + strata_wasm_bg.wasm),
      # consumed by stratadb.org's /playground via fetch-from-release.
      - name: Download the wasm bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-web
          path: artifacts

      # The IDL-generated command reference (docs pages + command-index.json +
      # schemas), consumed by stratadb.org's fetch-from-release pipeline. The
      # tarball roots at `generated/`. Committed docs are drift-guarded by
      # check-docs, so at a release tag they match the shipped binary.
      - name: Package the IDL docs bundle
        run: tar czf artifacts/strata-idl-docs.tar.gz -C crates/executor/idl/v1 generated

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum strata-v* strata-idl-docs.tar.gz strata-wasm-web.tar.gz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          gh release create "${{ github.ref_name }}" \
            --title "Strata ${{ github.ref_name }}" \
            --generate-notes \
            strata-v*.tar.gz strata-idl-docs.tar.gz strata-wasm-web.tar.gz checksums-sha256.txt

  # ---------------------------------------------------------------------------
  # 4. Update the Homebrew tap
  # ---------------------------------------------------------------------------
  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256 for archives
        id: sha
        run: |
          cd artifacts
          echo "arm64=$(sha256sum strata-v${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64=$(sha256sum strata-v${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum strata-v${{ steps.version.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: stratalab/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_ARM64: ${{ steps.sha.outputs.arm64 }}
          SHA_LINUX_X86_64: ${{ steps.sha.outputs.linux_x86_64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
        run: |
          cat > homebrew-tap/Formula/strata.rb <<'FORMULA'
          class Strata < Formula
            desc "Embedded database for the agent era: branch, time-travel, search"
            homepage "https://stratadb.org"
            version "VERSION_PLACEHOLDER"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/stratalab/strata-core/releases/download/vVERSION_PLACEHOLDER/strata-vVERSION_PLACEHOLDER-aarch64-apple-darwin.tar.gz"
                sha256 "SHA_ARM64_PLACEHOLDER"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/stratalab/strata-core/releases/download/vVERSION_PLACEHOLDER/strata-vVERSION_PLACEHOLDER-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_ARM64_PLACEHOLDER"
              end
              on_intel do
                url "https://github.com/stratalab/strata-core/releases/download/vVERSION_PLACEHOLDER/strata-vVERSION_PLACEHOLDER-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_X86_64_PLACEHOLDER"
              end
            end

            def install
              bin.install "strata"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/strata --version")
            end
          end
          FORMULA

          # Strip YAML indentation from the generated formula
          sed -i'' -e 's/^          //' homebrew-tap/Formula/strata.rb

          # Replace placeholders with actual values
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" homebrew-tap/Formula/strata.rb
          sed -i "s/SHA_ARM64_PLACEHOLDER/${SHA_ARM64}/g" homebrew-tap/Formula/strata.rb
          sed -i "s/SHA_LINUX_X86_64_PLACEHOLDER/${SHA_LINUX_X86_64}/g" homebrew-tap/Formula/strata.rb
          sed -i "s/SHA_LINUX_ARM64_PLACEHOLDER/${SHA_LINUX_ARM64}/g" homebrew-tap/Formula/strata.rb

      - name: Commit and push formula update
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/strata.rb
          git commit -m "Update strata to v${{ steps.version.outputs.version }}"
          git push
