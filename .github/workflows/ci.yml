name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features
        # No -- -D warnings: workspace.lints is the authority. clippy::all = deny
        # handles clippy warnings; warn-level rust lints (missing_docs, unreachable_pub)
        # are allowed until their owning scopes clear them.
      - name: Lockfile consistency
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Advisory + license check
        run: cargo deny check
      - name: DAG guard
        run: |
          # Guard: engine must not have normal dep on vector or graph
          if cargo tree --package strata-engine-next --edges=normal --format="{p}" | grep -q strata-vector; then
            echo "ERROR: strata-engine-next has normal dep on strata-vector" && exit 1
          fi
          if cargo tree --package strata-engine-next --edges=normal --format="{p}" | grep -q strata-graph; then
            echo "ERROR: strata-engine-next has normal dep on strata-graph" && exit 1
          fi
          # Manifest guard: engine must not depend on vector/graph (neither normal nor dev-deps)
          if grep -qE "^strata-(vector|graph)" crates/engine-next/Cargo.toml; then
            echo "ERROR: engine-next Cargo.toml must not list strata-vector or strata-graph" && exit 1
          fi

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace
      - name: Executor IDL overlay check
        run: |
          cargo run -p strata-executor-next --features idl-tooling --bin strata-idl -- check
          cargo run -p strata-executor-next --features idl-tooling --bin strata-idl -- check-cli
          cargo test -p strata-executor-next --features idl-tooling --test idl_kv_vector_overlay
      - name: Doc tests
        run: cargo test --workspace --doc --all-features --exclude strata-inference-next

  feature-matrix:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Feature powerset check
        # Local inference depends on a llama.cpp CMake build; exercise it in targeted jobs.
        run: cargo hack --feature-powerset --depth 2 --exclude-features local check --workspace --exclude strata-inference-next
      - name: Per-feature test
        run: cargo hack --each-feature --exclude-features local test --workspace --exclude strata-inference-next

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release --all

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: MSRV check
        run: cargo check --workspace --all-targets --all-features
