name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # strata-hub pins the stratahub crates by git rev and that repo is
  # private, so every cargo resolve needs read access. Fetch through the
  # git CLI so the token below applies.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        # Fine-grained PAT with Contents: read on stratalab/stratahub.
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Lockfile consistency
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Advisory + license + source check
        run: cargo deny check
      # Dependency-direction (DAG) enforcement lives in workspace guard
      # tests (crates/*/tests/dependency_guard*.rs, storage source guards)
      # and runs with the test job.

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        # gpu-cache device tests are #[ignore]d and skip without a GPU;
        # its host-sim suites run here.
        run: cargo test --locked --workspace
      - name: Conformance gates
        # Frozen-format and capability-contract harnesses, named so a
        # failure is visible as its own step.
        run: |
          cargo test --locked -p strata-storage --test format_golden
          cargo test --locked -p strata-engine --test capability_conformance
          cargo test --locked -p strata-executor --features testkit --test error_contract
      - name: Executor IDL drift gates
        run: |
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- check
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- check-cli
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- check-docs
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- check-tests
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- verify-examples
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- verify-fixtures
          cargo test --locked -p strata-executor --features idl-tooling,inference,testkit --test idl_kv_vector_overlay
          cargo test --locked -p strata-executor --features idl-tooling,inference,testkit --test generated_conformance
      - name: Inference feature lanes (offline)
        # The download module and the deterministic testkit are feature-gated
        # and invisible to the default workspace run; both are offline and
        # fast. Real provider/GGUF behavior stays in the gated nightly lanes.
        run: cargo test --locked -p strata-inference --features download,testkit --lib
      - name: Doc tests
        run: cargo test --locked --workspace --doc

  feature-matrix:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Feature powerset check
        # Excluded: `local`/`inference-local` (llama.cpp cmake build),
        # `ingest` (cross-repo executor pin, covered by hub-ingest),
        # `python` (pyo3 link), `differential` (RocksDB C++ build; its
        # lane runs nightly).
        run: >
          cargo hack --locked --feature-powerset --depth 2
          --exclude-features local,inference-local,ingest,python,differential
          check --workspace

  hub-ingest:
    # The stratahub-facing surface their ingest CLI compiles against:
    # `ingest` pulls stratahub-ingest, whose metadata layer pins
    # strata-executor at the blessed engine-swap SHA (a second, older
    # executor build — expected, not a conflict).
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Hub tests with ingest enabled
        run: cargo test --locked -p strata-hub --features ingest

  fault-injection:
    # The storage fault-injection integration targets (#2902): every test in
    # them is filtered out without the feature flag, so no other lane can see
    # them — three latent reds rotted invisibly this way (#2848, #2896,
    # #2902), each a testkit contract that silently fell behind an
    # intentional lib change. This lane keeps that class per-PR-visible.
    # The deep soaks stay nightly; this runs the deterministic contracts.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Storage fault-injection suite
        run: cargo test --locked -p strata-storage --features fault-injection

  perf-gates:
    # TCP5.2: instruction-count ceilings over the shipping paths. Callgrind
    # counts are deterministic (~0.02% observed spread; benchmarks/README.md)
    # and hardware-independent, so committed ceilings can block merges
    # without flapping. Ceilings live in scripts/perf_floors.py, pinned to
    # the workspace toolchain; the benches live in the out-of-workspace
    # benchmarks/ crate.
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: taiki-e/install-action@v2
        with:
          tool: iai-callgrind-runner@0.16.1
      - name: Instruction-count benches
        working-directory: benchmarks
        run: |
          cargo bench --locked --bench storage_commit -- --save-summary=json
          cargo bench --locked --bench storage_reopen -- --save-summary=json
          cargo bench --locked --bench wire_commands -- --save-summary=json
      - name: Perf ceilings gate
        run: python3 scripts/perf_floors.py --iai-root benchmarks/target/iai

  loom:
    # TCP4.3: exhaustive schedule exploration of the write-group protocol
    # (commit_group.rs) under loom. Fully deterministic — every schedule at
    # the model bounds is explored, so this can block merges without
    # flapping. The --cfg loom build swaps the storage sync seam
    # (crates/storage/src/sync.rs) to loom primitives; the separate cache
    # key keeps the differently-flagged dep tree warm.
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - name: Schedule-exploration models
        env:
          RUSTFLAGS: --cfg loom
        run: cargo test --locked -p strata-storage --lib -- commit_group_loom visibility_loom

  mutation-on-diff:
    # SQLite-style suite-strength gate, bounded to stay affordable: mutate
    # only the lines this PR touches; an un-killed mutant is a missing
    # assertion. Doc/test-only diffs produce no mutants and pass trivially.
    # 90 minutes: a large single-behavior storage diff (#2769, ~150 product
    # lines) produced more mutants than the original hour fit at ~110s per
    # mutant; the gate must be able to finish judging before it can gate.
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    # 90 minutes (#2770): sized for product diffs. The DST harness modules
    # are mutation-excluded at saturation (see .cargo/mutants.toml) — their
    # full-file mutant set outgrew any per-PR budget and their strength
    # mechanism is their own exact-facts pins.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      - name: Mutants on the PR diff
        # Partitioned by feature set (#2659): feature names are package-local,
        # so one global --features list cannot serve the workspace. Run A
        # covers every package except executor/inference under default
        # features (.cargo/mutants.toml holds that exclusion and the full
        # rationale); runs B and C cover those two packages under the same
        # feature sets the test job uses, so feature-gated code (idl_tooling,
        # the inference command surface, download) is compiled and its tests
        # actually run instead of reporting false MISSED. local-gated
        # inference files stay excluded: no CI lane can build them (cmake +
        # model artifacts). A run whose slice of the diff has no mutants
        # exits immediately, so single-crate PRs pay for one run.
        # Exit 3 (timeout-only, no missed mutants) passes: a mutant whose
        # test run never completes was killed by hang — the behavior change
        # was detected, just not by an assertion. Exit 2 (missed) still fails.
        run: |
          git diff "origin/${{ github.base_ref }}"...HEAD > pr.diff
          cargo mutants --in-diff pr.diff --timeout-multiplier 2.5 --minimum-test-timeout 60 || [ $? -eq 3 ]
          # IPC transport (crates/executor/src/ipc): the --exclude-re set below
          # is the residual equivalent/plumbing mutants the module's functional
          # suite (two-process round-trip, per-request scope, idle-timeout,
          # non-contention propagation, pid liveness, fnv1a goldens, RAII drop
          # cleanup, frame-cap pin) cannot distinguish. The decision LOGIC is
          # extracted into pure predicates with truth-table tests and stays
          # mutated: is_transient_accept_error / is_read_retry_error (accept and
          # read error classification), open_brokered's contention branch, and
          # serve_one (dispatch + scope). What is excluded:
          #  - serialize/panic fallbacks that are unreachable in practice;
          #  - the raw accept/read event-loop plumbing (connection-cap
          #    accounting needing 128 live sockets, log-only guards, and
          #    loop-condition mutants that only manifest as a hang);
          #  - IpcServer::stop's SIGTERM poll flag;
          #  - broker_to_owner, the racy owner start/stop retry window (its
          #    per-iteration branches are timing-dependent and convergent);
          #  - open_brokered's "any error retries" mutant, which merely defers
          #    a non-lock error one open attempt before re-surfacing it;
          #  - read_frame's inclusive-vs-exclusive cap boundary (distinguishing
          #    it requires a payload of exactly 64 MiB).
          # The default-feature executor slice compiles the hub- and
          # arrow-enabled handlers; the inverse feature-disabled stubs are
          # cfg-disabled here, so a mutant on them is a no-op on non-compiled
          # code and survives vacuously. hub_disabled.rs is a whole-file stub
          # excluded by PATH; arrow_feature_disabled is a single cfg-gated fn in
          # admin_convert.rs (which also holds real code), so it is excluded by
          # NAME — never by line number (line ranges rot and can swallow real
          # code). Its real behavior is covered by arrow_disabled_behavior.rs in
          # the no-arrow feature-matrix leg.
          # verify_case (idl_tooling::verify): the fixture-verifier orchestrator
          # — it reads every response fixture, replays it against a scratch
          # executor, and diffs. Its strength mechanism is the `verify-fixtures`
          # CI gate (which runs the REAL verify_case over the whole corpus and
          # fails on any mismatch), not a cargo test — cargo-mutants runs cargo
          # tests, which by construction never drive this file-reading/executing
          # orchestrator, so a body-stub survives vacuously (same doctrine as the
          # REPL/serve/IPC glue above). #3112 masks the wall-clock committed_at
          # inside it, which pulled its whole-body mutant into the diff. Excluded
          # by NAME (unique; verify_error_case is a distinct name); the pure
          # helper it calls (mask_committed_at) stays mutated.
          cargo mutants --no-config --in-diff pr.diff --package strata-executor \
            --features idl-tooling,inference,testkit \
            --exclude-re 'verify_case' \
            --exclude-re 'serialize_failure_envelope|internal_panic_error|static_wire_request_error' \
            --exclude-re 'in (listener_loop|handle_connection)' \
            --exclude-re 'delete ! in IpcServer::stop' \
            --exclude-re 'Connection::broker_to_owner' \
            --exclude-re 'with true in Connection::open_brokered' \
            --exclude-re 'replace > with >= in read_frame' \
            --exclude-re 'arrow_feature_disabled' \
            --exclude "crates/executor/src/executor/hub_disabled.rs" \
            --exclude "crates/executor/src/bin/**" \
            --timeout-multiplier 2.5 --minimum-test-timeout 60 || [ $? -eq 3 ]
          cargo mutants --no-config --in-diff pr.diff --package strata-inference \
            --features download,testkit \
            --exclude "crates/inference/src/llama/**" \
            --exclude "crates/inference/src/embed.rs" \
            --exclude "crates/inference/src/rank.rs" \
            --exclude "crates/inference/src/provider/local.rs" \
            --timeout-multiplier 2.5 --minimum-test-timeout 60 || [ $? -eq 3 ]
      - name: Upload mutants report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report-${{ github.run_id }}
          path: mutants.out
          retention-days: 30

  wasm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@v2
        with:
          # Pinned to the wasm-bindgen version in Cargo.lock — the runner
          # refuses a version mismatch, so bumps must move in lockstep.
          tool: wasm-bindgen-cli@0.2.118
      - name: Browser target tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked -p strata-wasm --target wasm32-unknown-unknown

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: MSRV check
        # Lib/bin targets only: MSRV is a promise about what users compile.
        # Dev-only dependencies (test servers, conformance stacks) may
        # require newer compilers and build under the pinned toolchain.
        run: cargo check --locked --workspace

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --locked --release --workspace
