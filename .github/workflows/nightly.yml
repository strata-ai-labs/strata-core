name: Nightly deep checks

# Heavy bug-finding lanes that are too expensive for per-PR CI: Miri,
# sanitizers, the coverage baseline, and release-mode tests. Per-PR CI
# (ci.yml) runs the debug-assertions leg of the 3-way suite run; this
# workflow runs the release and coverage legs.
#
# These lanes exist to break Strata, not to stay green. A red run here
# is a finding: file it, minimize it, and land the regression test with
# the fix.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  memory-safety-miri:
    # Undefined-behavior hunt on the unsafe-free crates. Strict
    # provenance turns pointer-integer sloppiness into hard errors.
    # Proptest case counts are lowered because Miri interprets, not
    # compiles; nightly budget covers core fully plus the storage
    # format layer (the pure decoders where UB would be durable-format
    # corruption).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri strata-core
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation
          PROPTEST_CASES: "8"
        run: cargo +nightly miri test -p strata-core
      - name: Miri strata-storage format layer
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation
          PROPTEST_CASES: "8"
        run: 'cargo +nightly miri test -p strata-storage --lib format::'

  # Sanitizer jobs run --tests (lib + integration binaries) only:
  # rustdoc links doctests against sanitized rlibs without the ASAN
  # runtime and the link fails. Doctests run unsanitized in per-PR CI.
  memory-safety-address-sanitizer:
    # ASAN + LSAN (leak checking is on by default on Linux) across the
    # full storage suite — the crate that owns real syscalls and byte
    # handling. build-std instruments std itself so there are no
    # uninstrumented holes.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: ASAN + LSAN storage tests
        # Intentional fixture leaks go through testkit::leak_static /
        # forget_registered, which keep them reachable from a process
        # global — so every leak LSAN reports here is a real one. Bare
        # Box::leak/mem::forget in storage test code will show up as a
        # red run; route new fixtures through the registry instead.
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly test --tests -Zbuild-std --target x86_64-unknown-linux-gnu -p strata-storage
      - name: ASAN + LSAN engine tests
        # Engine has no intentional fixture leaks, so LSAN (on by
        # default with ASAN on Linux) is a real leak gate here.
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly test --tests -Zbuild-std --target x86_64-unknown-linux-gnu -p strata-engine

  memory-safety-thread-sanitizer:
    # TSAN over storage: commit guards, maintenance scheduling, and
    # close ordering are the real-thread surfaces. Slow (5-15x), which
    # is why it lives here and not per-PR.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: TSAN storage tests
        env:
          RUSTFLAGS: -Zsanitizer=thread
        run: cargo +nightly test --tests -Zbuild-std --target x86_64-unknown-linux-gnu -p strata-storage

  failure-during-failure-soak:
    # Compound-anomaly bug hunt: a second fault injected during crash
    # recovery and inside maintenance publish transitions, every case
    # verified against the recovery oracle. The bounded grid runs per-PR
    # via the in-crate unit tests; this lane runs the full integration
    # grid plus a deep multi-seed soak.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Write-ordering watchdog
        run: cargo test --locked -p strata-storage --features fault-injection --test write_ordering
      - name: Compound fault grid
        run: cargo test --locked -p strata-storage --features fault-injection --test compound_faults
      - name: Compound fault soak
        env:
          STRATA_STORAGE_COMPOUND_CASES: "20000"
        run: cargo test --locked -p strata-storage --features fault-injection --test compound_faults -- --ignored
      - name: Config differential soak
        run: cargo test --locked -p strata-storage --lib config_differential -- --ignored --skip pressure_retries_are_invisible_to_readers
      - name: Background scheduler liveness (perf-trace)
        # The closed-loop endurance suite is perf-trace gated and therefore
        # invisible to per-PR CI (default features); this is its only lane.
        run: cargo test --locked -p strata-storage --features perf-trace --lib background_scale

  coverage-baseline:
    # Publishes per-crate region/line coverage. Baseline only for now:
    # the merge-blocking threshold gate is a later slice, and per the
    # program charter thresholds ratchet up, never down.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Workspace coverage
        run: |
          cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          {
            echo '## Workspace coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            lcov.info
            coverage-summary.txt
          retention-days: 90

  release-mode-tests:
    # The release leg of the 3-way suite run: debug_assertions off,
    # optimizations on. Catches release-only miscompiles/UB symptoms
    # and any correctness that hides behind debug_assert!.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests (release)
        run: cargo test --locked --release --workspace
