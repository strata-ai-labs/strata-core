caption: List keys under a prefix, in key order.
steps:
  - call: kv.put
    args: { key: "user:1", value: a }
  - call: kv.put
    args: { key: "user:2", value: b }
  - call: kv.put
    args: { key: other, value: c }
  - call: kv.list
    args: { prefix: "user:" }
    returns: ["user:1", "user:2"]
