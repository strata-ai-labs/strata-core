caption: Promote a fork's change back into the branch it came from.
steps:
  - call: kv.put
    args: { key: config, value: base }
  - call: branch.fork
    args: { source: default, branch: experiment }
  - call: kv.put
    args: { key: config, value: tuned, branch: experiment }
    note: change on the fork
  - call: branch.merge
    args: { source: experiment, target: default, strategy: strict }
    note: applies the fork's change onto default
