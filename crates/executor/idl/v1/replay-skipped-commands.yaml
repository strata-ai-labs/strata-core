# Replay-skip allowlist (drift guard, TCP3.8c).
#
# The fixture-behavior guard executes every command's primary request fixture
# against a scratch cache executor and diffs the output against its golden
# response. A command may opt out by setting `fixtures.replay_skip` (with a
# reason), but every such command must be listed here and this list may ONLY
# shrink: a new skip fails the build unless it is justified and added here, and
# a command that becomes replayable must be removed. This keeps golden-or-replay
# coverage from silently eroding.
#
# The current entries fall into four groups, each blocked by an environment the
# scratch cache executor cannot provide deterministically:
#   * hub — resolves and downloads a dataset over the network;
#   * arrow — reads/writes real files outside the scratch executor;
#   * inference — loads a model / performs network I/O / is machine-dependent;
#   * event reads — wall-clock timestamps are hashed into event content, so the
#     output never reproduces.
#
# `budget` (W0b) MUST equal the number of `skipped` entries below. The list is
# shrink-only per entry; this budget caps the TOTAL so the debt cannot creep up
# silently (it grew 7->12 before this gate existed). Adding a skip requires
# raising `budget` in the same change with a rationale; draining requires lowering
# `budget` to match. Enforced by `enforce_debt_budget` in
# `crates/executor/src/idl_tooling.rs`.
budget: 12
skipped:
  - admin.hub_clone
  - arrow.export
  - arrow.import
  - event.get
  - event.list
  - event.range
  - event.range_time
  - hub.get_dataset
  - hub.info
  - hub.list_datasets
  - hub.list_refs
  - hub.list_yanked
