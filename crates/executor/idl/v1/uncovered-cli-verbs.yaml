# CLI round-trip allowlist (drift guard #2, strategy: v1-idl-overlay-strategy.md).
#
# Every visible clap leaf verb must map back to a catalog entry with
# `surface: verb`, or appear here. This list may ONLY shrink: authoring IDL
# coverage for a verb requires deleting its line, and the guard test in
# crates/cli/src/catalog_guard.rs fails if a listed verb is covered, stale,
# or if a new verb is neither covered nor listed.
uncovered:
  - agents commands
  - agents errors
  - agents guide
  - agents init
  - arrow export
  - arrow import
  - clone
  - command print
  - command run
  - config get
  - config get-key
  - config path
  - config set
  - config show
  - config unset
  - describe
  - doctor
  - event by-type
  - health
  - inference cache-status
  - inference capability
  - inference detokenize
  - inference embed
  - inference embed-batch
  - inference generate
  - inference models list
  - inference models local
  - inference models pull
  - inference rank
  - inference tokenize
  - inference unload
  - info
  - init
  - mcp serve
  - metrics
  - ping
  - remote
