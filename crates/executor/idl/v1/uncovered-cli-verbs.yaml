# CLI round-trip allowlist (drift guard #2, strategy: v1-idl-overlay-strategy.md).
#
# Every visible clap leaf verb must map back to a catalog entry with
# `surface: verb`, or appear here. This list may ONLY shrink: authoring IDL
# coverage for a verb requires deleting its line, and the guard test in
# crates/cli/src/catalog_guard.rs fails if a listed verb is covered, stale,
# or if a new verb is neither covered nor listed.
uncovered:
  - agents commands
  - agents errors
  - agents guide
  - agents init
  - command print
  - command run
  - config path
  - config set
  - config show
  - config unset
  - doctor
  - event by-type
  - init
  - mcp serve
