# CLI round-trip allowlist (drift guard #2, strategy: v1-idl-overlay-strategy.md).
#
# Every visible clap leaf verb must map back to a catalog entry with
# `surface: verb`, or appear here. This list may ONLY shrink: authoring IDL
# coverage for a verb requires deleting its line, and the guard test in
# crates/cli/src/catalog_guard.rs fails if a listed verb is covered, stale,
# or if a new verb is neither covered nor listed.
#
# As of the full 120-command family coverage, the residents here are not
# "unfinished" — they are verbs with no wire command by design:
#   - CLI-local operations that never reach the executor: init, doctor,
#     uninstall (#2995 — removes the installation itself, host filesystem
#     only), agents {guide,commands,errors,init,skill}, mcp serve, config
#     {path,set,unset,show} (config get/get-key ARE wire commands and are
#     covered), command {run,print} (the generic escape hatch itself).
#   - broker-owner lifecycle wrappers: start blocks hosting a socket until
#     stopped (it serves, so it cannot be a request/response command); stop
#     orchestrates a client open and forwards the ipc_stop wire command, so
#     the verb itself maps to no single catalog entry.
#   - event by-type: a curated clap alias of event.list (EventList) with a
#     type filter. One catalog entry owns one cli_path today, so the alias
#     stays here until the overlay grows explicit alias paths (strategy
#     "unless an explicit alias is declared").
uncovered:
  - agents commands
  - agents errors
  - agents guide
  - agents init
  - agents skill
  - command print
  - command run
  - config path
  - config set
  - config show
  - config unset
  - doctor
  - event by-type
  - init
  - mcp serve
  - start
  - stop
  - uninstall
