# Arrow conformance ledger — the tracked map of what the Arrow import/export
# surface HAS and HAS NOT been tested. One entry per scenario "cell".
#
# The lint (`arrow_conformance.rs`) enforces:
#   status: covered  => `test:` names a #[test] fn that exists in an arrow test
#                        source (arrow_behavior.rs / arrow_disabled_behavior.rs /
#                        arrow/schema.rs / arrow_conformance.rs).
#   status: gap      => `issue:` names the tracking issue.
#   status: accepted => `note:` states why it is intentionally not covered.
#
# Scenario space (see docs/architecture/arrow-conformance.md):
#   direction × target{kv,json,vector,event,graph} × format{csv,jsonl,parquet}
#   + value fidelity (per Arrow type) + edge cases + error paths + silent-success.
# NOTE: IPC (.arrow) is NOT a supported format — ArrowFileFormat = {Csv,Jsonl,Parquet}.

cells:
  # ---- round-trip: target × format (export -> file -> import identity) --------
  - id: roundtrip.kv.csv
    scenario: KV export -> CSV -> import preserves bytes (leading-zero keys/values)
    status: covered
    test: csv_import_preserves_numeric_looking_string_keys_and_values
  - id: roundtrip.kv.jsonl
    scenario: KV export -> JSONL -> import preserves bytes
    status: covered
    test: csv_kv_import_and_jsonl_export_round_trip_bytes
  - id: roundtrip.kv.parquet
    scenario: KV export -> Parquet -> import preserves bytes
    status: gap
    issue: 3083
    note: no parquet-kv round-trip test yet
  - id: roundtrip.json.string_column
    scenario: JSON doc as a Utf8/string column round-trips (CSV in, JSONL out)
    status: covered
    test: csv_json_import_and_jsonl_export_preserve_documents
  - id: roundtrip.json.nested_struct_jsonl
    scenario: JSON doc with nested object/array/null via JSONL (Arrow struct)
    status: covered
    test: jsonl_struct_import_stores_a_real_document_not_a_display_string
  - id: roundtrip.json.parquet
    scenario: JSON doc round-trips through Parquet (struct/list value column)
    status: gap
    issue: 3083
    note: no parquet-json nested round-trip test yet
  - id: roundtrip.vector.jsonl_parquet
    scenario: vector export -> import preserves embedding + metadata, no internal leak
    status: covered
    test: vector_export_import_round_trip_preserves_metadata_without_leaking_internals
  - id: roundtrip.vector.csv
    scenario: vector export -> CSV is rejected up front (non-retryable, no truncated file) since embeddings are nested
    status: covered
    test: vector_export_to_csv_is_rejected_up_front_without_touching_the_output_file
  - id: roundtrip.event
    scenario: event export -> import restores payloads and types
    status: covered
    test: event_export_import_round_trip_restores_payloads_and_types
  - id: roundtrip.graph
    scenario: graph export -> import restores nodes and edges
    status: covered
    test: graph_export_import_round_trip_restores_nodes_and_edges
  - id: roundtrip.graph.csv_numeric_ids
    scenario: graph CSV round-trip with numeric-looking string node/edge ids
    status: covered
    test: csv_graph_round_trip_preserves_numeric_looking_node_and_edge_ids
  - id: roundtrip.event.csv_numeric_type
    scenario: event CSV round-trip with a numeric-looking event_type
    status: covered
    test: csv_event_round_trip_preserves_numeric_looking_event_types

  # ---- value fidelity: Arrow type -> correct JSON/value -----------------------
  - id: value.scalars
    scenario: all Arrow scalar types (int/uint/float/bool/utf8/binary/null) convert
    status: covered
    test: json_document_and_object_conversion_cover_arrow_scalars
  - id: value.nested_struct
    scenario: Arrow Struct value -> JSON object (nested, nulls preserved)
    status: covered
    test: cell_to_json_reconstructs_nested_struct_and_preserves_null
  - id: value.nested_list
    scenario: Arrow List value -> JSON array (nulls preserved)
    status: covered
    test: cell_to_json_reconstructs_list
  - id: value.float_nonfinite
    scenario: Float NaN/Inf value -> must not silently become JSON null
    status: covered
    test: cell_to_json_rejects_non_finite_floats_instead_of_nulling_them
  - id: value.dictionary
    scenario: a dictionary-encoded value column decodes to the underlying value's JSON (a dict int is 42, not "42")
    status: covered
    test: cell_to_json_decodes_dictionary_to_the_underlying_value
  - id: value.temporal_decimal
    scenario: Decimal/Timestamp/Date/Time/Duration render as the Arrow Display string
    status: accepted
    note: "#3091: JSON has no native temporal or decimal type; ISO-8601 / decimal-text is lossless (a JSON number would lose Decimal precision), so the Display string is the intended representation"
  - id: value.largelist_fixedsizelist
    scenario: LargeList / FixedSizeList value -> real JSON array, not the Display string
    status: covered
    test: cell_to_json_reconstructs_large_list
  - id: value.nested_map
    scenario: Map value -> real JSON object, not the Display string
    status: covered
    test: cell_to_json_reconstructs_map_as_object

  # ---- edge cases -------------------------------------------------------------
  - id: edge.encoding_nonbase64
    scenario: an unsupported key_encoding/value_encoding (hex, base64url, ...) is rejected, not silently mis-decoded as raw bytes
    status: covered
    test: kv_import_rejects_an_unsupported_value_encoding
  - id: edge.late_field_inference
    scenario: a JSONL field first appearing after row 100 is not dropped from the schema
    status: covered
    test: jsonl_import_keeps_a_field_that_first_appears_after_row_100
  - id: edge.late_column_type_inference
    scenario: a CSV column type only disambiguated by a row after 100 is not mis-typed from the prefix
    status: covered
    test: csv_import_infers_column_type_from_a_value_after_row_100
  - id: edge.null_cells
    scenario: null KV value / null graph weight / null endpoint handled (not flattened)
    status: gap
    issue: 3083
  - id: edge.empty_jsonl_export
    scenario: an empty (0-row) export round-trips to zero imported rows
    status: gap
    issue: 3083
  - id: edge.unicode_and_delimiters
    scenario: unicode + embedded commas/newlines/quotes survive each format
    status: gap
    issue: 3083
    note: CSV quoting/escaping of embedded JSON not yet exercised
  - id: edge.branch_space_isolation
    scenario: import/export respects branch and space isolation
    status: covered
    test: arrow_import_export_respects_branch_and_space_isolation
  - id: edge.durable_reopen
    scenario: durable import survives reopen and re-exports
    status: covered
    test: durable_arrow_import_survives_reopen_and_exports

  # ---- error paths ------------------------------------------------------------
  - id: error.unknown_format
    scenario: unknown/unsupported format rejected before storage mutation
    status: covered
    test: arrow_import_rejects_unknown_format_before_storage_mutation
  - id: error.missing_input
    scenario: missing input file reported before feature work
    status: covered
    test: missing_input_is_reported_before_arrow_feature_work
  - id: error.missing_primitive_options
    scenario: export missing required primitive options rejected
    status: covered
    test: arrow_export_rejects_missing_primitive_options
  - id: error.event_missing_columns
    scenario: event import rejects a file missing event columns
    status: covered
    test: event_import_rejects_a_file_missing_event_columns
  - id: error.vector_missing_collection
    scenario: vector import into a missing collection fails, no metric defaulting
    status: covered
    test: vector_import_into_missing_collection_fails_instead_of_defaulting_a_metric
  - id: error.feature_disabled
    scenario: arrow commands return stable feature-disabled errors without the feature
    status: covered
    test: arrow_commands_return_stable_feature_disabled_errors_without_feature
  - id: error.code_list_accuracy
    scenario: the IDL error-code list per arrow command matches what it can emit
    status: gap
    issue: 3083
    note: export/import error lists are cross-wired (#3058 class)

  # ---- silent-success (import reports OK but data not stored) -----------------
  - id: silent.event_overreport
    scenario: event import reports real rows_skipped when the engine rejects rows, not a success overstating what landed
    status: covered
    test: event_import_reports_rows_the_engine_rejected_as_skipped
  - id: silent.graph_atomic_no_partial
    scenario: graph batch import cannot over-report — it is atomic (all-or-Err)
    status: accepted
    note: "#3081 graph claim falsified: graph_batch_item_result only builds BatchItem::ok, so a rejected op fails the whole GraphBatchWrite with an Err (never a partial Ok); rows_skipped=0 is always correct"
