[package]
name = "strata-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Serializable command boundary for the rebuilt engine"

[features]
default = ["localfs", "arrow", "hub"]
arrow = ["dep:arrow", "dep:parquet"]
# StrataHub clone support. Off for targets that cannot carry the native
# HTTP/tokio client stack (the wasm build consumes the executor with
# default-features = false).
hub = ["dep:strata-hub"]
# TCP4.2a differential-testing lane: pulls the in-process RocksDB oracle.
# Heavy C++ build — nightly CI only; excluded from the feature powerset.
differential = ["dep:rocksdb", "dep:bson"]
idl-tooling = ["dep:serde_yaml", "dep:sha2", "dep:schemars", "dep:jsonschema", "dep:tempfile", "strata-engine/wire-schemas", "strata-inference?/wire-schemas"]
inference = ["dep:strata-inference"]
inference-anthropic = ["inference"]
inference-google = ["inference"]
# Local model execution implies pull: the local story is catalog -> download
# -> load, so `download` rides with `local` (cloud-only builds stay pull-free
# and return unsupported from InferenceModelsPull).
inference-local = [
    "inference",
    "strata-inference/local",
    "strata-inference/download",
]
inference-openai = ["inference"]
localfs = ["strata-engine/localfs"]
testkit = ["strata-engine/testkit", "strata-inference?/testkit"]
jsonschema = ["dep:jsonschema"]

[dependencies]
arrow = { workspace = true, optional = true }
base64 = { workspace = true }
parquet = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
rocksdb = { version = "0.24", optional = true, default-features = false }
# TCP4.2b: BSON codec for the minimal MongoDB wire client (no full driver).
bson = { version = "2", optional = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
strata-core = { path = "../core" }
strata-engine = { path = "../engine", default-features = false }
strata-hub = { path = "../hub", optional = true }
strata-inference = { path = "../inference", optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
jsonschema = { version = "0.47", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# std::time clocks trap on wasm32; time_compat routes through JS clocks.
web-time = { workspace = true }

[[bin]]
name = "strata-idl"
path = "src/bin/strata-idl/main.rs"
required-features = ["idl-tooling"]

[[test]]
name = "differential_kv"
required-features = ["differential"]

[[test]]
name = "differential_json"
required-features = ["differential"]

[[test]]
name = "differential_graph"
required-features = ["differential"]

[dev-dependencies]
tiny_http = "0.12"
url = "2"
tempfile = { workspace = true }
# The TCP4.7 parity harness reads its shrink-only divergence ledger
# (idl/v1/cross-surface-divergences.yaml) without requiring `idl-tooling`.
serde_yaml = { workspace = true }

[lints]
workspace = true
