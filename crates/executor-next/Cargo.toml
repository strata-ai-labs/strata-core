[package]
name = "strata-executor-next"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Serializable command boundary for the rebuilt engine"

[features]
default = ["localfs", "arrow"]
arrow = ["dep:arrow", "dep:parquet"]
idl-tooling = ["dep:serde_yaml", "dep:sha2"]
inference = ["dep:strata-inference-next"]
inference-anthropic = ["inference"]
inference-google = ["inference"]
inference-local = ["inference", "strata-inference-next/local"]
inference-openai = ["inference"]
localfs = ["strata-engine-next/localfs"]
testkit = ["strata-engine-next/testkit"]

[dependencies]
arrow = { workspace = true, optional = true }
base64 = { workspace = true }
parquet = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
strata-core-next = { path = "../core-next" }
strata-engine-next = { path = "../engine-next", default-features = false }
strata-inference-next = { path = "../inference-next", optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[[bin]]
name = "strata-idl"
path = "src/bin/strata-idl/main.rs"
required-features = ["idl-tooling"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
