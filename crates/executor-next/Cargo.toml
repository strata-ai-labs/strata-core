[package]
name = "strata-executor-next"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Serializable command boundary for the rebuilt engine"

[features]
default = ["localfs", "arrow"]
arrow = ["dep:arrow", "dep:base64", "dep:parquet"]
localfs = ["strata-engine-next/localfs"]
testkit = ["strata-engine-next/testkit"]

[dependencies]
arrow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
strata-core-next = { path = "../core-next" }
strata-engine-next = { path = "../engine-next", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
