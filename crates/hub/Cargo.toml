[package]
name = "strata-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "StrataHub adapter: bundle export/import and hub orchestration over the Strata engine"
publish = false

[dependencies]
# Wire-contract dependencies (coordination doc §3.1): serde_jcs is pinned
# byte-for-byte to stratahub's workspace pin; blake3 is byte-deterministic
# by spec at any 1.x.
blake3 = "1"
serde_jcs = "=0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strata-core = { path = "../core" }
strata-engine = { path = "../engine" }
tempfile = "3"
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
semver = "1"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "0.8"
url = "2"
stratahub-client = { git = "https://github.com/stratalab/stratahub", rev = "283ca9ce500b43090aa81309014d14674c74ecae" }
stratahub-ingest = { git = "https://github.com/stratalab/stratahub", rev = "283ca9ce500b43090aa81309014d14674c74ecae" }
stratahub-protocol = { git = "https://github.com/stratalab/stratahub", rev = "283ca9ce500b43090aa81309014d14674c74ecae" }

[dev-dependencies]
tiny_http = "0.12"
stratahub-testkit = { git = "https://github.com/stratalab/stratahub", rev = "283ca9ce500b43090aa81309014d14674c74ecae" }

[lints]
workspace = true
