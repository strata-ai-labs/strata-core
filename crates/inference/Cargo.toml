[package]
name = "strata-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Inference runtime for Strata model execution"

[lints]
workspace = true

[features]
default = ["anthropic", "openai", "google"]
local = ["dep:cmake"]
# Derive JSON schemas on the public wire DTOs for IDL tooling only.
wire-schemas = ["dep:schemars"]
download = ["dep:ureq", "dep:sha2"]
anthropic = ["dep:ureq"]
openai = ["dep:ureq"]
google = ["dep:ureq"]
testkit = []

[build-dependencies]
cmake = { version = "0.1", optional = true }

[dependencies]
schemars = { workspace = true, optional = true }
serde = { workspace = true }
# Base dependency: the wire DTOs, GBNF grammar, and tool-call parsing use
# serde_json unconditionally (not just the cloud providers), so it must be
# available in `--no-default-features` builds.
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
tracing = { workspace = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
