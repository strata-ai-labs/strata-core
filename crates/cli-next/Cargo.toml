[package]
name = "strata-cli-next"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Handwritten command-line interface for Strata V1"

[features]
# Cloud providers ride in the lean binary by default: they are pure-Rust HTTP
# clients with no build-time cost, and an API key at runtime is the only
# requirement. Local model execution (vendored llama.cpp, cmake, optional
# CUDA) stays opt-in via `inference-local`.
default = ["cloud"]
cloud = ["inference-anthropic", "inference-google", "inference-openai"]
# Provider features imply the base `inference` feature: the CLI's own command
# surface is gated on `inference`, so a provider-only selection must still
# light it up (mirrors the executor's feature graph).
inference = ["strata-executor-next/inference"]
inference-anthropic = ["inference", "strata-executor-next/inference-anthropic"]
inference-google = ["inference", "strata-executor-next/inference-google"]
inference-local = ["inference", "strata-executor-next/inference-local"]
inference-openai = ["inference", "strata-executor-next/inference-openai"]

[dependencies]
base64 = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
rustyline = "14"
serde = { workspace = true }
serde_json = { workspace = true }
shlex = "1.3"
strata-executor-next = { path = "../executor-next" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "strata"
path = "src/main.rs"

[lints]
workspace = true
